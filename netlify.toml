[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  framework = "#auto"

# Canonical host in one hop for both HTTP host variants.
[[redirects]]
  from = "http://noblehardwoods.co/*"
  to = "https://www.noblehardwoods.co/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.noblehardwoods.co/*"
  to = "https://www.noblehardwoods.co/:splat"
  status = 301
  force = true

# Preserve authority and remove 404s for the legacy Webflow service URLs.
